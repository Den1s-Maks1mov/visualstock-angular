<div class="container mt-5" style="">

  <div class="mb-4">
    <a [routerLink]="['/photos']" class="btn btn-secondary btn-back-styled">
      &#8592; Назад до списку
    </a>
  </div>

  <div class="d-flex justify-content-center">
    <div class="details-container card p-4 shadow-lg mx-auto form-details-container" style="max-width: 500px;">
      <h2 class="card-title text-center mb-4">Авторизація</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <div *ngIf="loginFailed" class="alert alert-danger text-center mb-4" role="alert">
          {{ errorMessage }}
        </div>

        <div class="mb-4 field-spacing">
          <label for="email" class="form-label form-label-dark">Логін (Пошта)</label>
          <input type="email" id="email" class="form-control" formControlName="email">
          <div *ngIf="email?.invalid && email?.touched" class="text-danger mt-1">
            <small *ngIf="email?.errors?.['required']">Пошта є обов'язковою.</small>
            <small *ngIf="email?.errors?.['email']">Некоректний формат пошти.</small>
          </div>
        </div>

        <div class="mb-4 field-spacing">
          <label for="password" class="form-label form-label-dark">Пароль</label>
          <input type="password" id="password" class="form-control" formControlName="password">
          <div *ngIf="password?.invalid && password?.touched" class="text-danger mt-1">
            <small *ngIf="password?.errors?.['required']">Пароль є обов'язковим.</small>
            <small *ngIf="password?.errors?.['minlength']">Мінімум 6 символів.</small>
          </div>
        </div>

        <div class="mt-4">
          <button type="submit" class="btn-submit-action" [disabled]="loginForm.invalid || isLoading">
            <span *ngIf="isLoading">Вхід...</span>
            <span *ngIf="!isLoading">Увійти</span>
          </button>
        </div>

        <div class="text-center mt-3">
          <p class="form-label-dark">Не маєте акаунту? <a [routerLink]="['/register']">Зареєструватися</a></p>
        </div>
      </form>
    </div>
  </div>
</div>
